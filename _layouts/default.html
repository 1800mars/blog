<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | prepend: site.baseurl }}">
</head>
<body>
  <header>
    <nav>
      <a href="{{ site.baseurl }}/" class="site-title">{{ site.title }}</a>
      <span class="nav-links">
        <a href="{{ site.baseurl }}/">posts</a>
        <a href="{{ site.url }}/">main site</a>
        <a href="{{ '/feed.xml' | prepend: site.baseurl | prepend: site.url }}">rss</a>
      </span>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>&copy; {{ site.time | date: '%Y' }} amarah boulanger | <a href="{{ site.url }}/">1800mars.github.io</a></p>
  </footer>
</body>
</html>
