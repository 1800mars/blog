---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  {% if page.tags.size > 0 %}
  <span class="tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</span>
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
  <a href="{{ site.baseurl }}/" class="back">&larr; back to posts</a>
</article>
